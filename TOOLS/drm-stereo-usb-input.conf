# Optional mpv input configuration for LIVE NVIDIA 3D Vision tuning.
# Run mpv from its repository root and pass:
#   --input-conf=TOOLS/drm-stereo-usb-input.conf
# The USB runtime control path requires MPV_DRM_STEREO_USB_CONTROL=1.
# These bindings adjust the FIRMWARE eye command timer, not DRM scanout.
# The separate USB thread applies each change to subsequent commands.
Alt+LEFT run python3 TOOLS/drm_stereo_usb_phase_ctl.py --parent -- -100
Alt+RIGHT run python3 TOOLS/drm_stereo_usb_phase_ctl.py --parent +100
Alt+DOWN run python3 TOOLS/drm_stereo_usb_phase_ctl.py --parent -- -25
Alt+UP run python3 TOOLS/drm_stereo_usb_phase_ctl.py --parent +25
Alt+0 run python3 TOOLS/drm_stereo_usb_phase_ctl.py --parent get
